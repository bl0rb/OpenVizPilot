    <rect x="450" y="872" width="12" height="12" rx="2" fill="rgba(185,28,28,0.05)" stroke="#b91c1c" stroke-width="1"/>
    <text x="470" y="882" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ABLEHNUNG</text>

    <rect x="570" y="872" width="12" height="12" rx="2" fill="rgba(15,23,42,0.05)" stroke="#475569" stroke-width="1"/>
    <text x="590" y="882" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DATEN</text>

    <line x1="670" y1="878" x2="698" y2="878" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="706" y="882" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PFAD ABGELEHNT</text>
  </svg>
