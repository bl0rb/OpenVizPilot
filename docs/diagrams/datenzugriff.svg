    <text x="120" y="884" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDE</text>

    <rect x="210" y="872" width="12" height="12" rx="2" fill="rgba(180,83,9,0.06)" stroke="#b45309" stroke-width="1" stroke-dasharray="3,2"/>
