name: PR CI

on:
  pull_request:
  push:
    branches:
      - main
  # Erlaubt den Publish-Workflows, diese Checks als Release-Gate aufzurufen.
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Typecheck + Tests + Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24 = Laufzeit des Docker-Images; node:sqlite (Memory-Dev-Backend)
          # braucht mindestens 22.5.
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails the build on a known-vulnerable dependency instead of leaving it
      # to whoever happens to run `npm audit` by hand.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  build-checks:
    name: Image + Chart Build Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t openvizpilot:ci .

      # Bauen reicht nicht: ein Bundling-Fehler (z. B. umgeschriebene
      # node:-Imports) zeigt sich erst beim Start des Containers.
      - name: Smoke-run image
        run: |
          docker run -d --name tchat \
            -e OVP_LLM_BASE_URL=http://localhost:9 -e OVP_LLM_API_KEY=sk-ci \
            -e OVP_DEFAULT_MODEL=m -e OVP_DATABASE_PATH=/tmp/memory.db \
            -p 3000:3000 openvizpilot:ci
          trap 'docker rm -f tchat' EXIT
          ok=""
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/healthz > /dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs tchat
          [ "$ok" = "1" ]
          curl -sf http://localhost:3000/api/session | python3 -c 'import json, sys; s = json.load(sys.stdin); assert s == {"user": None, "access": {"ai": False, "tableauApi": False, "serverData": False}}, s'
          # A supplied Tableau header must not bypass the per-user AI approval.
          status=$(curl -sS -o /tmp/memory-response.json -w '%{http_code}' -H 'x-tableau-user: ci' http://localhost:3000/api/memory)
          cat /tmp/memory-response.json
          [ "$status" = "403" ]
          python3 -c 'import json; r = json.load(open("/tmp/memory-response.json")); assert r.get("code") == "approval_required" and r.get("capability") == "ai", r'

      - name: Install Helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.2-linux-amd64.tar.gz -o helm.tgz
          echo "9318379b847e333460d33d291d4c088156299a26cd93d570a7f5d0c36e50b5bb  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Lint Helm chart
        # Mit gültigen Pflicht-Values, damit lint sauber durchläuft —
        # die required/fail-Guards prüft der Negativ-Render-Check unten.
        run: |
          helm lint charts/openvizpilot \
            --set llm.baseUrl=http://litellm:4000 \
            --set llm.apiKey=ci-render-check \
            --set app.defaultModel=test-model

      - name: Render Helm chart (CNPG-Memory, Default)
        run: |
          helm template test charts/openvizpilot \
            --set llm.baseUrl=http://litellm:4000 \
            --set llm.apiKey=ci-render-check \
            --set app.defaultModel=test-model > /dev/null

      - name: Render Helm chart (externes Postgres + Ingress)
        run: |
          helm template test charts/openvizpilot \
            --set llm.apiKeySecret.existingSecret=litellm-secret \
            --set llm.baseUrl=http://litellm:4000 \
            --set app.defaultModel=test-model \
            --set memory.database.mode=external \
            --set memory.database.external.existingSecret=memory-db \
            --set ingress.enabled=true \
            --set ingress.host=chat.example.com > /dev/null

      - name: Render Helm chart fails without LLM key
        run: |
          if helm template test charts/openvizpilot \
               --set llm.baseUrl=http://litellm:4000 \
               --set app.defaultModel=test-model > /dev/null 2>&1; then
            echo "expected render to fail without llm.apiKey/apiKeySecret"
            exit 1
          fi

      - name: Render Helm chart (Enterprise edition, image.repository derived)
        run: |
          helm template test charts/openvizpilot \
            --set llm.baseUrl=http://litellm:4000 \
            --set llm.apiKey=ci-render-check \
            --set app.defaultModel=test-model \
            --set image.edition=enterprise \
            --set imagePullSecrets[0].name=ghcr-enterprise \
            | grep -q 'image: "ghcr.io/bl0rb/openvizpilot-enterprise:' \
            || { echo "expected enterprise edition to render the enterprise image repository"; exit 1; }

      - name: Render Helm chart fails for Enterprise edition without imagePullSecrets
        run: |
          if helm template test charts/openvizpilot \
               --set llm.baseUrl=http://litellm:4000 \
               --set llm.apiKey=ci-render-check \
               --set app.defaultModel=test-model \
               --set image.edition=enterprise > /dev/null 2>&1; then
            echo "expected render to fail for image.edition=enterprise without imagePullSecrets"
            exit 1
          fi

      - name: Render Helm chart honours explicit image.repository override
        run: |
          helm template test charts/openvizpilot \
            --set llm.baseUrl=http://litellm:4000 \
            --set llm.apiKey=ci-render-check \
            --set app.defaultModel=test-model \
            --set image.edition=enterprise \
            --set imagePullSecrets[0].name=ghcr-enterprise \
            --set image.repository=my.registry/openvizpilot \
            | grep -q 'image: "my.registry/openvizpilot:' \
            || { echo "expected explicit image.repository to win over the edition default"; exit 1; }
