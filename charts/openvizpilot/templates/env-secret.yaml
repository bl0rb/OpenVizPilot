{{- include "openvizpilot.checkLegacyLitellmValues" . }}
{{- $needsApiKey := and (not .Values.llm.apiKeySecret.existingSecret) .Values.llm.apiKey }}
{{- $needsAuthToken := and (not .Values.app.authTokenSecret.existingSecret) .Values.app.authToken }}
{{- $needsAdminToken := and (not .Values.app.adminTokenSecret.existingSecret) .Values.app.adminToken }}
{{- if not (or .Values.llm.apiKeySecret.existingSecret .Values.llm.apiKey) }}
{{- fail "Entweder llm.apiKeySecret.existingSecret oder llm.apiKey (nur Dev/CI) muss gesetzt sein" }}
{{- end }}
{{- if or $needsApiKey $needsAuthToken $needsAdminToken }}
# Nur für Dev/CI: Klartext-Werte aus values.yaml. In Produktion
# existingSecret verwenden (z. B. via External Secrets Operator).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openvizpilot.envSecretName" . }}
  labels:
    {{- include "openvizpilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needsApiKey }}
  OVP_LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  {{- end }}
  {{- if $needsAuthToken }}
  OVP_API_AUTH_TOKEN: {{ .Values.app.authToken | quote }}
  {{- end }}
  {{- if $needsAdminToken }}
  OVP_ADMIN_TOKEN: {{ .Values.app.adminToken | quote }}
  {{- end }}
{{- end }}
