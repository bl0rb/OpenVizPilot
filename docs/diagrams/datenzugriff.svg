<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 930" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="openvizpilot-datenzugriff-title openvizpilot-datenzugriff-desc">
    <title id="openvizpilot-datenzugriff-title">OpenVizPilot — Vier Hürden vor serverseitigen Daten</title>
    <desc id="openvizpilot-datenzugriff-desc">Fragt das Modell über das Tool tableau_view_data Daten aus einer Tableau-View außerhalb des Dashboards ab, prüft die Middleware nacheinander vier Hürden: erstens die Lizenz-Merkmale serverData, tableauServer und sso, zweitens die von einem Admin je Person erteilte Freigabe „Serverdaten“, drittens den Site-Schalter „Serverseitige Daten erlauben“ mit dem Scope tableau:views:download, viertens die einmalige Einwilligung der Person im Dialog. Erst wenn alle vier bestehen, folgt der Abruf der View-Summary-Daten über einen engen Transportpfad mit festen Variablen, Zeit- und Größengrenzen und einem Budget von acht Abfragen je zwei Minuten. Fehlt eine Hürde, wird der Aufruf sichtbar mit einem eigenen Fehlercode abgelehnt. Jeder Abruf, der die Hürden passiert hat, erzeugt einen pseudonymisierten Audit-Eintrag mit Ergebnis oder Fehlerstatus, neunzig Tage aufbewahrt; Ablehnungen durch Freigabe, Einwilligung oder Budget greifen davor und werden nicht protokolliert.</desc>
    <defs>
      <marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
      </marker>
      <marker id="arrow-ent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#b45309"/>
      </marker>
      <marker id="arrow-core" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f46e5"/>
      </marker>
      <marker id="arrow-deny" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#b91c1c"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#f8fafc"/>

    <!-- Spine: Start -->
    <rect x="120" y="56" width="340" height="56" rx="6" fill="rgba(15,23,42,0.05)" stroke="#475569" stroke-width="1"/>
    <rect x="128" y="62" width="34" height="12" rx="2" fill="transparent" stroke="rgba(71,85,105,0.40)" stroke-width="0.8"/>
    <text x="145" y="71" fill="rgba(71,85,105,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
    <text x="290" y="86" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Anfrage des Modells</text>
    <text x="290" y="100" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Tool-Call · tableau_view_data</text>

    <line x1="290" y1="112" x2="290" y2="148" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow-slate)"/>

    <!-- Hürde 1 -->
    <rect x="120" y="148" width="340" height="76" rx="6" fill="rgba(180,83,9,0.06)" stroke="#b45309" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="128" y="154" width="70" height="12" rx="2" fill="transparent" stroke="rgba(180,83,9,0.45)" stroke-width="0.8"/>
    <text x="163" y="163" fill="rgba(180,83,9,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HÜRDE 1</text>
    <text x="290" y="184" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Lizenz-Merkmale</text>
    <text x="290" y="200" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">serverData + tableauServer + sso</text>
    <text x="290" y="213" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Enterprise-Lizenz, Feature-Gate</text>

    <line x1="460" y1="186" x2="620" y2="186" stroke="#b91c1c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-deny)"/>
    <rect x="620" y="148" width="280" height="76" rx="6" fill="rgba(185,28,28,0.05)" stroke="#b91c1c" stroke-width="1"/>
    <rect x="628" y="154" width="66" height="12" rx="2" fill="transparent" stroke="rgba(185,28,28,0.40)" stroke-width="0.8"/>
    <text x="661" y="163" fill="rgba(185,28,28,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ABLEHNUNG</text>
    <text x="760" y="184" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Tool nicht registriert</text>
    <text x="760" y="200" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Lizenzfreigabe fehlt</text>
    <text x="760" y="213" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Modell sieht das Tool nie</text>

    <line x1="290" y1="224" x2="290" y2="268" stroke="#b45309" stroke-width="1.2" marker-end="url(#arrow-ent)"/>

