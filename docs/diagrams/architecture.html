  <h1>Wie OpenVizPilot funktioniert</h1>
  <p class="subtitle">Core: Extension im Dashboard, statuslose Middleware, OpenAI-kompatibles LLM. Enterprise: lizenzpflichtige Zusatzwege serverseitig.</p>

    <desc id="openvizpilot-arch-desc">Die Chat-Extension im Tableau-Dashboard ruft die statuslose Middleware per SSE auf; Tool-Aufrufe laufen im Browser in der Viewer-Session gegen die Dashboard-Daten, RLS bleibt intakt. Die Middleware trägt System-Prompt, Tool-Definitionen, SSE-Streaming und einen Scope-Guard, spricht einen OpenAI-kompatiblen LLM-Endpunkt an und hält Einstellungen, Freigaben und User-Memory in einer Betriebsdatenbank (SQLite oder Postgres). Vier lizenzpflichtige Enterprise-Zusatzwege sind gestrichelt abgesetzt: Tableau Server REST- und Metadata-API unter der persönlichen Identität des Nutzers, serverseitiger View-Datenzugriff nach Einwilligung, ein Watch-Scheduler, der nach Zeitplan prüft und per Webhook, Microsoft Teams oder E-Mail meldet, sowie ein täglicher Lizenz-Heartbeat zu WerkWorks, der nur Zählwerte, keine Inhalte überträgt.</desc>
