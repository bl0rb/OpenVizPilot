{{- $needsApiKey := and (not .Values.litellm.apiKeySecret.existingSecret) .Values.litellm.apiKey }}
{{- $needsAuthToken := and (not .Values.app.authTokenSecret.existingSecret) .Values.app.authToken }}
{{- $needsAdminToken := and (not .Values.app.adminTokenSecret.existingSecret) .Values.app.adminToken }}
{{- if not (or .Values.litellm.apiKeySecret.existingSecret .Values.litellm.apiKey) }}
{{- fail "Entweder litellm.apiKeySecret.existingSecret oder litellm.apiKey (nur Dev/CI) muss gesetzt sein" }}
{{- end }}
{{- if or $needsApiKey $needsAuthToken $needsAdminToken }}
# Nur für Dev/CI: Klartext-Werte aus values.yaml. In Produktion
# existingSecret verwenden (z. B. via External Secrets Operator).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openvizpilot.envSecretName" . }}
  labels:
    {{- include "openvizpilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needsApiKey }}
  LITELLM_API_KEY: {{ .Values.litellm.apiKey | quote }}
  {{- end }}
  {{- if $needsAuthToken }}
  API_AUTH_TOKEN: {{ .Values.app.authToken | quote }}
  {{- end }}
  {{- if $needsAdminToken }}
  ADMIN_TOKEN: {{ .Values.app.adminToken | quote }}
  {{- end }}
{{- end }}
