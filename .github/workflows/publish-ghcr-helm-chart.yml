name: Publish GHCR Helm Chart

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Chart/app version to publish (for example 0.2.0)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  CHART_PATH: charts/openvizpilot
  OCI_REPO: ghcr.io/bl0rb/charts

# Wie beim Image: parallele Tag-Läufe dürfen sich nicht überholen.
concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Release-Gate wie beim Image-Publish: erst wenn die PR-CI grün ist.
  # Nur im öffentlichen Repo — das Chart entsteht ausschließlich aus dem
  # Core-Export, das private Repo publiziert hier nichts.
  ci:
    name: CI Checks
    if: github.repository == 'bl0rb/OpenVizPilot'
    uses: ./.github/workflows/pr-ci.yml
    permissions:
      contents: read

  publish-chart:
    needs: ci
    if: github.repository == 'bl0rb/OpenVizPilot'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set chart version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      # Release-Gate: Chart nur aus einem Core-Export publizieren. Das Chart und
      # das Enterprise-Image entstehen in zwei Repos; nur der Export-Bot
      # (enterprise-export-core.yml) setzt den Tag erst, nachdem das
      # Enterprise-Image gebaut ist. Ein von Hand im Core-Repo gesetzter v*-Tag
      # (1.7.8: Dependabot-Merge) erzeugte sonst ein Chart ohne passendes
      # Enterprise-Image → ImagePullBackOff bei image.edition=enterprise.
      - name: Require a core-export release commit
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BOT_EMAIL: werkworks-release@users.noreply.github.com
        run: |
          TAG="v${VERSION}"
          git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}" || {
            echo "::error title=Release-Gate::Tag ${TAG} existiert nicht im Repository."
            exit 1
          }
          SHA="$(git rev-list -n1 "${TAG}")"
          AUTHOR="$(git log -1 --format=%ae "${SHA}")"
          SUBJECT="$(git log -1 --format=%s "${SHA}")"
          if [ "${AUTHOR}" != "${BOT_EMAIL}" ] || [ "${SUBJECT}" != "Core release ${TAG}" ]; then
            echo "::error title=Release-Gate::Tag ${TAG} zeigt auf '${SUBJECT}' (${AUTHOR}), nicht auf einen Core-Export-Commit. Charts werden nur aus enterprise-export-core.yml publiziert — Tag im Core-Repo nicht von Hand setzen."
            exit 1
          fi
          echo "Release-Gate OK: ${TAG} → ${SHA} (${SUBJECT})"

      - name: Install Helm
        shell: bash
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.2-linux-amd64.tar.gz -o helm.tgz
          echo "9318379b847e333460d33d291d4c088156299a26cd93d570a7f5d0c36e50b5bb  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Log in to GHCR for Helm OCI
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username "${{ github.actor }}" --password-stdin

      - name: Package chart
        id: package
        shell: bash
        run: |
          PACKAGE_OUTPUT=$(helm package "${{ env.CHART_PATH }}" \
            --version "${{ steps.version.outputs.value }}" \
            --app-version "${{ steps.version.outputs.value }}")
          echo "$PACKAGE_OUTPUT"
          PACKAGE_FILE=$(echo "$PACKAGE_OUTPUT" | sed -n 's/^Successfully packaged chart and saved it to: //p' | xargs -n1 basename)
          echo "file=${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"

      - name: Push chart to GHCR OCI
        shell: bash
        run: |
          # 403 heißt hier fast immer: Das Paket existiert bereits und ist nicht
          # mit DIESEM Repository verknüpft (typisch nach einem Repo-Umzug) —
          # das GITHUB_TOKEN darf dann nicht schreiben. Ohne diesen Hinweis
          # steht in den Logs nur "403 Forbidden".
          if ! helm push "${{ steps.package.outputs.file }}" "oci://${{ env.OCI_REPO }}"; then
            echo "::error title=GHCR-Push abgelehnt::Falls 403: Paket ${{ env.OCI_REPO }}/openvizpilot mit diesem Repository verknüpfen — GitHub → Packages → Package settings → Manage Actions access → Repository hinzufügen, Rolle 'Write'. Danach diesen Workflow erneut ausführen (workflow_dispatch, Version ohne 'v')."
            exit 1
          fi
