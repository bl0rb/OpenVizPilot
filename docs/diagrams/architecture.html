<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OpenVizPilot — Architektur</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #f8fafc; color: #0f172a; font-family: 'Inter', sans-serif; padding: 2rem 1.5rem; }
  main { max-width: 960px; margin: 0 auto; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.18em;
             text-transform: uppercase; color: #64748b; margin-bottom: 0.5rem; }
  h1 { font-family: 'Instrument Serif', serif; font-size: 1.75rem; font-weight: 400; margin-bottom: 0.25rem; }
  .subtitle { color: #475569; font-size: 0.875rem; margin-bottom: 1.5rem; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">OpenVizPilot</p>
  <h1>Wie OpenVizPilot funktioniert</h1>
  <p class="subtitle">Extension im Dashboard, statuslose Middleware auf EKS, LLM hinter einem OpenAI-kompatiblen Endpunkt.</p>

  <svg viewBox="0 0 960 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="openvizpilot-arch-title openvizpilot-arch-desc">
    <title id="openvizpilot-arch-title">OpenVizPilot — Architektur</title>
    <desc id="openvizpilot-arch-desc">Die Chat-Extension im Tableau-Dashboard ruft die Middleware auf EKS per SSE auf; das LLM fordert Tool-Calls an, die die Extension in der Session des Users gegen die Dashboard-Daten ausführt. Die Middleware spricht einen OpenAI-kompatiblen LLM-Endpunkt an, liefert Anschlussfragen und Aktions-Vorschläge (ausgeführt nur per Klick) und merkt sich Nutzer-Fakten in Postgres.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f46e5"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
    </defs>

    <!-- Hintergrund -->
    <rect width="100%" height="100%" fill="#f8fafc"/>

    <!-- Zonen -->
    <rect x="24" y="64" width="272" height="304" rx="8" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
    <rect x="104" y="68" width="112" height="12" rx="2" fill="#f8fafc"/>
    <text x="160" y="77" fill="rgba(15,23,42,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TABLEAU SERVER</text>

    <rect x="344" y="64" width="272" height="304" rx="8" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
    <rect x="436" y="68" width="88" height="12" rx="2" fill="#f8fafc"/>
    <text x="480" y="77" fill="rgba(15,23,42,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">EKS-CLUSTER</text>

    <rect x="664" y="64" width="272" height="304" rx="8" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
    <rect x="776" y="68" width="48" height="12" rx="2" fill="#f8fafc"/>
    <text x="800" y="77" fill="rgba(15,23,42,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LLM</text>

    <!-- Pfeile (vor den Boxen) -->
    <!-- Extension -> Middleware -->
    <line x1="260" y1="128" x2="380" y2="128" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="276" y="108" width="88" height="12" rx="2" fill="#f8fafc"/>
    <text x="320" y="117" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /API/CHAT</text>

    <!-- Middleware -> Extension (SSE-Rückkanal mit tool_calls) -->
    <line x1="380" y1="160" x2="260" y2="160" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="288" y="168" width="64" height="12" rx="2" fill="#f8fafc"/>
    <text x="320" y="177" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOOL_CALLS</text>

    <!-- Extension -> Dashboard-Daten (Tools ausführen) -->
    <line x1="136" y1="176" x2="136" y2="264" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="88" y="214" width="40" height="12" rx="2" fill="#f8fafc"/>
    <text x="124" y="223" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">TOOLS</text>

    <!-- Dashboard-Daten -> Extension (Ergebnisse) -->
    <line x1="184" y1="264" x2="184" y2="176" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="192" y="214" width="44" height="12" rx="2" fill="#f8fafc"/>
    <text x="196" y="223" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">DATEN</text>

    <!-- Middleware -> LLM-Endpunkt -->
    <line x1="580" y1="128" x2="700" y2="128" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
    <rect x="604" y="108" width="72" height="12" rx="2" fill="#f8fafc"/>
    <text x="640" y="117" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPENAI-API</text>

    <!-- Middleware -> User-Memory (fire-and-forget) -->
    <line x1="480" y1="176" x2="480" y2="264" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <rect x="420" y="214" width="48" height="12" rx="2" fill="#f8fafc"/>
    <text x="468" y="223" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">FAKTEN</text>

    <!-- LLM-Endpunkt -> Modelle -->
    <line x1="800" y1="176" x2="800" y2="264" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Nodes -->
    <!-- Extension (fokal) -->
    <rect x="60" y="112" width="200" height="64" rx="6" fill="#f8fafc"/>
    <rect x="60" y="112" width="200" height="64" rx="6" fill="rgba(79,70,229,0.08)" stroke="#4f46e5" stroke-width="1"/>
    <rect x="68" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,70,229,0.40)" stroke-width="0.8"/>
    <text x="82" y="127" fill="rgba(79,70,229,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
    <text x="160" y="148" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">OpenVizPilot Extension</text>
    <text x="160" y="164" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Chat-UI · Tools · Action-Chips</text>

    <!-- Dashboard-Daten (Store) -->
    <rect x="60" y="264" width="200" height="64" rx="6" fill="#f8fafc"/>
    <rect x="60" y="264" width="200" height="64" rx="6" fill="rgba(15,23,42,0.05)" stroke="#475569" stroke-width="1"/>
    <rect x="68" y="270" width="28" height="12" rx="2" fill="transparent" stroke="rgba(71,85,105,0.40)" stroke-width="0.8"/>
    <text x="82" y="279" fill="rgba(71,85,105,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
    <text x="160" y="300" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Dashboard-Daten</text>
    <text x="160" y="316" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Extensions API · Summary · Filter</text>

    <!-- Middleware (fokal) -->
    <rect x="380" y="112" width="200" height="64" rx="6" fill="#f8fafc"/>
    <rect x="380" y="112" width="200" height="64" rx="6" fill="rgba(79,70,229,0.08)" stroke="#4f46e5" stroke-width="1"/>
    <rect x="388" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,70,229,0.40)" stroke-width="0.8"/>
    <text x="402" y="127" fill="rgba(79,70,229,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
    <text x="480" y="148" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Middleware</text>
    <text x="480" y="164" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Hono · statuslos · SSE</text>

    <!-- User-Memory (Store) -->
    <rect x="380" y="264" width="200" height="64" rx="6" fill="#f8fafc"/>
    <rect x="380" y="264" width="200" height="64" rx="6" fill="rgba(15,23,42,0.05)" stroke="#475569" stroke-width="1"/>
    <rect x="388" y="270" width="28" height="12" rx="2" fill="transparent" stroke="rgba(71,85,105,0.40)" stroke-width="0.8"/>
    <text x="402" y="279" fill="rgba(71,85,105,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
    <text x="480" y="300" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">User-Memory</text>
    <text x="480" y="316" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PostgreSQL · CloudNativePG</text>

    <!-- LLM-Endpunkt (extern) -->
    <rect x="700" y="112" width="200" height="64" rx="6" fill="#f8fafc"/>
    <rect x="700" y="112" width="200" height="64" rx="6" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
    <rect x="708" y="118" width="28" height="12" rx="2" fill="transparent" stroke="rgba(15,23,42,0.30)" stroke-width="0.8"/>
    <text x="722" y="127" fill="rgba(15,23,42,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GW</text>
    <text x="800" y="148" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">LLM-Endpunkt</text>
    <text x="800" y="164" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OpenAI-API · z. B. LiteLLM</text>

    <!-- Modelle (extern) -->
    <rect x="700" y="264" width="200" height="64" rx="6" fill="#f8fafc"/>
    <rect x="700" y="264" width="200" height="64" rx="6" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
    <rect x="708" y="270" width="28" height="12" rx="2" fill="transparent" stroke="rgba(15,23,42,0.30)" stroke-width="0.8"/>
    <text x="722" y="279" fill="rgba(15,23,42,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
    <text x="800" y="300" fill="#0f172a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Modelle</text>
    <text x="800" y="316" fill="#475569" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Claude · GPT · …</text>

    <!-- Callouts -->
    <text x="32" y="420" fill="#0f172a" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Datenzugriff nur in der Session des Users — RLS bleibt intakt.</text>
    <path d="M 200 408 Q 172 376 142 340" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="140" cy="336" r="2" fill="#0f172a"/>

    <text x="436" y="420" fill="#0f172a" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">schlägt Anschlussfragen und Aktionen vor — ausgeführt nur per Klick</text>
    <path d="M 440 408 Q 344 316 324 190" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
    <circle cx="322" cy="186" r="2" fill="#0f172a"/>

    <!-- Legende -->
    <line x1="32" y1="436" x2="928" y2="436" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
    <text x="32" y="456" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDE</text>

    <rect x="120" y="444" width="12" height="12" rx="2" fill="rgba(79,70,229,0.08)" stroke="#4f46e5" stroke-width="1"/>
    <text x="140" y="454" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DIESES REPO</text>

    <rect x="248" y="444" width="12" height="12" rx="2" fill="rgba(15,23,42,0.05)" stroke="#475569" stroke-width="1"/>
    <text x="268" y="454" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DATEN</text>

    <rect x="348" y="444" width="12" height="12" rx="2" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
    <text x="368" y="454" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">EXTERN</text>

    <line x1="452" y1="450" x2="480" y2="450" stroke="#2e5aa8" stroke-width="1.2"/>
    <text x="488" y="454" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTP/SSE</text>

    <line x1="576" y1="450" x2="604" y2="450" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="612" y="454" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RÜCKFLUSS / ASYNC</text>
  </svg>
</main>
</body>
</html>
