{{- include "openvizpilot.checkLegacyLitellmValues" . }}
{{- include "openvizpilot.checkEnterpriseImagePullSecret" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openvizpilot.fullname" . }}
  labels:
    {{- include "openvizpilot.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openvizpilot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "openvizpilot.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: middleware
          image: "{{ include "openvizpilot.imageRepository" . }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            - name: OVP_LLM_BASE_URL
              value: {{ required "llm.baseUrl ist Pflicht" .Values.llm.baseUrl | quote }}
            - name: OVP_DEFAULT_MODEL
              value: {{ required "app.defaultModel ist Pflicht" .Values.app.defaultModel | quote }}
            {{- with .Values.app.modelAllowlist }}
            - name: OVP_MODEL_ALLOWLIST
              value: {{ . | quote }}
            {{- end }}
            - name: OVP_APP_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: OVP_LOG_LEVEL
              value: {{ .Values.app.logLevel | quote }}
            {{- if not .Values.app.scopeGuard }}
            - name: OVP_SCOPE_GUARD
              value: "off"
            {{- end }}
            {{- with .Values.app.scopeModel }}
            - name: OVP_SCOPE_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.app.publicUrl }}
            - name: OVP_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.app.environment }}
            - name: OVP_ENVIRONMENT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.mode }}
            - name: OVP_AUTH_MODE
              value: {{ . | quote }}
            {{- end }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: OVP_OIDC_PROVIDER
              value: {{ .Values.oidc.provider | quote }}
            - name: OVP_OIDC_ISSUER
              value: {{ required "oidc.issuer ist Pflicht bei auth.mode=oidc" .Values.oidc.issuer | quote }}
            - name: OVP_OIDC_CLIENT_ID
              value: {{ required "oidc.clientId ist Pflicht bei auth.mode=oidc" .Values.oidc.clientId | quote }}
            - name: OVP_OIDC_SCOPES
              value: {{ .Values.oidc.scopes | quote }}
            {{- with .Values.oidc.clientSecretSecret.existingSecret }}
            - name: OVP_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.oidc.clientSecretSecret.key }}
            {{- end }}
            {{- end }}
            {{- with .Values.license.existingSecret }}
            - name: OVP_LICENSE
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.license.key }}
            {{- end }}
            {{- with .Values.license.publicKeyB64url }}
            {{ fail "license.publicKeyB64url wird nicht mehr unterstützt — der Vertrauensanker ist fest eingebaut" }}
            {{- end }}
            - name: OVP_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.llm.apiKeySecret.existingSecret }}
                  name: {{ .Values.llm.apiKeySecret.existingSecret }}
                  key: {{ .Values.llm.apiKeySecret.key }}
                  {{- else }}
                  name: {{ include "openvizpilot.envSecretName" . }}
                  key: OVP_LLM_API_KEY
                  {{- end }}
            {{- if or .Values.app.authTokenSecret.existingSecret .Values.app.authToken }}
            - name: OVP_API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.app.authTokenSecret.existingSecret }}
                  name: {{ .Values.app.authTokenSecret.existingSecret }}
                  key: {{ .Values.app.authTokenSecret.key }}
                  {{- else }}
                  name: {{ include "openvizpilot.envSecretName" . }}
                  key: OVP_API_AUTH_TOKEN
                  {{- end }}
            {{- end }}
            {{- if or .Values.app.adminTokenSecret.existingSecret .Values.app.adminToken }}
            - name: OVP_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.app.adminTokenSecret.existingSecret }}
                  name: {{ .Values.app.adminTokenSecret.existingSecret }}
                  key: {{ .Values.app.adminTokenSecret.key }}
                  {{- else }}
                  name: {{ include "openvizpilot.envSecretName" . }}
                  key: OVP_ADMIN_TOKEN
                  {{- end }}
            {{- end }}
            {{- if .Values.memory.enabled }}
            {{- with .Values.memory.model }}
            - name: OVP_MEMORY_MODEL
              value: {{ . | quote }}
            {{- end }}
            - name: OVP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if eq .Values.memory.database.mode "cnpg" }}
                  # Vom CloudNativePG-Operator erzeugtes App-Secret des Clusters
                  name: {{ include "openvizpilot.dbClusterName" . }}-app
                  key: uri
                  {{- else }}
                  name: {{ required "memory.database.external.existingSecret ist Pflicht bei mode=external" .Values.memory.database.external.existingSecret }}
                  key: {{ .Values.memory.database.external.key }}
                  {{- end }}
            {{- end }}
            {{- with .Values.app.secretKeySecret.existingSecret }}
            - name: OVP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.app.secretKeySecret.key }}
            {{- end }}
            {{- if not .Values.app.watchEnabled }}
            - name: OVP_WATCH_ENABLED
              value: "false"
            {{- end }}
            {{- with .Values.smtp.urlSecret.existingSecret }}
            - name: OVP_SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.smtp.urlSecret.key }}
            {{- end }}
            {{- with .Values.smtp.from }}
            - name: OVP_SMTP_FROM
              value: {{ . | quote }}
            {{- end }}
            {{- range .Values.tableau.secretRefs }}
            {{- if not (regexMatch "^OVP_TABLEAU_[A-Z0-9_]+$" .env) }}
            {{- fail "Tableau secretRefs.env muss mit OVP_TABLEAU_ beginnen und nur A-Z, 0-9, _ enthalten" }}
            {{- end }}
            - name: {{ .env | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "Tableau secretRefs.secretName fehlt" .secretName | quote }}
                  key: {{ required "Tableau secretRefs.key fehlt" .key | quote }}
            {{- end }}
            {{- range .Values.mcp.secretRefs }}
            {{- if not (regexMatch "^OVP_MCP_[A-Z0-9_]+$" .env) }}
            {{- fail "MCP secretRefs.env muss mit OVP_MCP_ beginnen und nur A-Z, 0-9, _ enthalten" }}
            {{- end }}
            - name: {{ .env | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "MCP secretRefs.secretName fehlt" .secretName | quote }}
                  key: {{ required "MCP secretRefs.key fehlt" .key | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
